# Builds the macOS app and publishes it to a GitHub Release, which is where the
# README's download link, the app's own updater and the Homebrew cask in
# danlinenberg/homebrew-odin all fetch from.
# All three resolve /releases/latest/download/Odin-arm64.dmg, so the asset name
# below has to stay exactly that.
#
# The windows job adds Odin-Setup-x64.exe to the same release. Dispatched on a
# branch other than main, only the windows job runs, and the installer lands
# as a workflow artifact instead of a release - that is how to test it.
#
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Only this repo cuts Odin releases - a fork running this would publish to
    # its own releases under our version numbers, and burn macOS minutes doing it.
    if: github.repository == 'danlinenberg/odin' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: macos-15
    # Holds ODIN_SIGNING_P12; only v* tags and main may deploy to it.
    environment: release
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    env:
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # postinstall skips this when CI is set (nested installs were flaky), so
      # the native modules have to be rebuilt for Electron explicitly.
      - run: bun run --filter=@odin/desktop install:deps

      # A manual run on a main whose version is already released builds the
      # next patch instead: the checked-out package.json files are bumped in
      # place (not committed), so the app reports the version it ships under.
      - name: Pick version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          V=$(jq -r .version apps/desktop/package.json)
          if [[ -n "$REF_TAG" ]]; then
            TAG="$REF_TAG"
          elif gh release view "v$V" >/dev/null 2>&1; then
            LATEST=$(gh release view --json tagName -q .tagName)
            NEW=$(awk -F. '{print $1"."$2"."$3+1}' <<<"${LATEST#v}")
            for f in apps/desktop/package.json packages/host-service/package.json; do
              jq --arg v "$NEW" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            done
            TAG="v$NEW"
          else
            TAG="v$V"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG"

      # electron.vite.config.ts bakes these into the bundle as *_BAKED. Without
      # them a fresh install (brew, DMG) has no OAuth apps and every
      # Connections row says "This build has no <name> app".
      # ODIN_SIGNING_P12 is the one signing cert every release uses. macOS keys
      # privacy grants to it, so a fresh cert per release re-prompts every user
      # for Desktop/Documents access after each update. Fail rather than mint one.
      - run: |
          : "${ODIN_SIGNING_P12:?ODIN_SIGNING_P12 secret is missing}"
          bun run build
        env:
          ODIN_SIGNING_P12: ${{ secrets.ODIN_SIGNING_P12 }}
          ODIN_SLACK_CLIENT_ID: ${{ secrets.ODIN_SLACK_CLIENT_ID }}
          ODIN_SLACK_CLIENT_SECRET: ${{ secrets.ODIN_SLACK_CLIENT_SECRET }}
          ODIN_SLACK_REDIRECT_URL: ${{ secrets.ODIN_SLACK_REDIRECT_URL }}
          ODIN_GITHUB_CLIENT_ID: ${{ secrets.ODIN_GITHUB_CLIENT_ID }}
          ODIN_NOTION_CLIENT_ID: ${{ secrets.ODIN_NOTION_CLIENT_ID }}
          ODIN_NOTION_CLIENT_SECRET: ${{ secrets.ODIN_NOTION_CLIENT_SECRET }}
          ODIN_NOTION_REDIRECT_URL: ${{ secrets.ODIN_NOTION_REDIRECT_URL }}
          ODIN_JIRA_CLIENT_ID: ${{ secrets.ODIN_JIRA_CLIENT_ID }}
          ODIN_JIRA_CLIENT_SECRET: ${{ secrets.ODIN_JIRA_CLIENT_SECRET }}
          ODIN_JIRA_REDIRECT_URL: ${{ secrets.ODIN_JIRA_REDIRECT_URL }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg=$(ls apps/desktop/release/*.dmg)
          # The cask resolves /releases/latest/download/Odin-arm64.dmg, so the
          # asset name has to stay the same across releases.
          mv "$dmg" Odin-arm64.dmg
          # No upload --clobber fallback: re-uploading into an existing release
          # swaps a newer build in under the old date and version.
          gh release create "$TAG" Odin-arm64.dmg \
            --title "$TAG" \
            --generate-notes

  windows:
    needs: macos
    # Runs after macos publishes the release, and alone when macos is skipped
    # (a branch dispatch). A failed macos build means no release to add to.
    # ci/windows-build: temporarily allow a fork to build the unsigned Windows
    # installer as a workflow artifact. Not for merging to main.
    if: >-
      (github.repository == 'danlinenberg/odin'
        || github.repository == 'yuval-silman-imagen/odin')
      && !failure() && !cancelled()
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SKIP_ENV_VALIDATION: "true"
      TAG: ${{ needs.macos.outputs.tag }}
      # native-keymap builds with warnings-as-errors, and Electron 40's V8
      # headers deprecate an API it calls (C4996). MSVC appends _CL_ after the
      # project's own flags, so it wins; CL comes first and loses.
      # Dash, not slash: Git Bash rewrites /wd4996 into a path.
      _CL_: -wd4996
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run --filter=@odin/desktop install:deps

      # The app reports the version macos picked, bumped in place like there.
      - name: Set version
        if: env.TAG != ''
        run: |
          for f in apps/desktop/package.json packages/host-service/package.json; do
            jq --arg v "${TAG#v}" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      # Not `bun run build`: its prebuild mints a macOS signing identity.
      - working-directory: apps/desktop
        run: |
          bun run generate:icons
          bun run compile:app
          bun run copy:native-modules
          bun run validate:native-runtime
          bunx electron-builder --win --publish never
        env:
          ODIN_SLACK_CLIENT_ID: ${{ secrets.ODIN_SLACK_CLIENT_ID }}
          ODIN_SLACK_CLIENT_SECRET: ${{ secrets.ODIN_SLACK_CLIENT_SECRET }}
          ODIN_SLACK_REDIRECT_URL: ${{ secrets.ODIN_SLACK_REDIRECT_URL }}
          ODIN_GITHUB_CLIENT_ID: ${{ secrets.ODIN_GITHUB_CLIENT_ID }}
          ODIN_NOTION_CLIENT_ID: ${{ secrets.ODIN_NOTION_CLIENT_ID }}
          ODIN_NOTION_CLIENT_SECRET: ${{ secrets.ODIN_NOTION_CLIENT_SECRET }}
          ODIN_NOTION_REDIRECT_URL: ${{ secrets.ODIN_NOTION_REDIRECT_URL }}
          ODIN_JIRA_CLIENT_ID: ${{ secrets.ODIN_JIRA_CLIENT_ID }}
          ODIN_JIRA_CLIENT_SECRET: ${{ secrets.ODIN_JIRA_CLIENT_SECRET }}
          ODIN_JIRA_REDIRECT_URL: ${{ secrets.ODIN_JIRA_REDIRECT_URL }}

      - if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" apps/desktop/release/Odin-Setup-x64.exe

      - if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: Odin-Setup-x64
          path: apps/desktop/release/Odin-Setup-x64.exe

  # ci/windows-build: a fork's Mac build, as a workflow artifact - the same
  # self-signed scheme as releases (no Apple notarization), with a certificate
  # minted for this build since forks don't hold ODIN_SIGNING_P12. Not for
  # merging to main.
  macos-fork:
    if: github.repository == 'yuval-silman-imagen/odin'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run --filter=@odin/desktop install:deps

      # create-signing-identity.sh imports ODIN_SIGNING_P12 and trusts it; in
      # CI it refuses to mint one itself, so mint it here, exactly as it would.
      - name: Mint this build's signing certificate
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          printf '%s\n' '[req]' 'distinguished_name = dn' 'x509_extensions = v3' 'prompt = no' \
            '[dn]' 'CN = Odin Local Signing' \
            '[v3]' 'basicConstraints = critical,CA:false' 'keyUsage = critical,digitalSignature' \
            'extendedKeyUsage = critical,codeSigning' > "$tmp/openssl.cnf"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -sha256 -days 7300 -nodes \
            -keyout "$tmp/key.pem" -out "$tmp/cert.pem" -config "$tmp/openssl.cnf" 2>/dev/null
          /usr/bin/openssl pkcs12 -export -inkey "$tmp/key.pem" -in "$tmp/cert.pem" \
            -out "$tmp/identity.p12" -passout pass:odin-signing -name "Odin Local Signing" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          echo "ODIN_SIGNING_P12=$(base64 < "$tmp/identity.p12" | tr -d '\n')" >> "$GITHUB_ENV"
          rm -rf "$tmp"

      - run: bun run build
        env:
          ODIN_SLACK_CLIENT_ID: ${{ secrets.ODIN_SLACK_CLIENT_ID }}
          ODIN_SLACK_CLIENT_SECRET: ${{ secrets.ODIN_SLACK_CLIENT_SECRET }}
          ODIN_SLACK_REDIRECT_URL: ${{ secrets.ODIN_SLACK_REDIRECT_URL }}
          ODIN_GITHUB_CLIENT_ID: ${{ secrets.ODIN_GITHUB_CLIENT_ID }}
          ODIN_NOTION_CLIENT_ID: ${{ secrets.ODIN_NOTION_CLIENT_ID }}
          ODIN_NOTION_CLIENT_SECRET: ${{ secrets.ODIN_NOTION_CLIENT_SECRET }}
          ODIN_NOTION_REDIRECT_URL: ${{ secrets.ODIN_NOTION_REDIRECT_URL }}
          ODIN_JIRA_CLIENT_ID: ${{ secrets.ODIN_JIRA_CLIENT_ID }}
          ODIN_JIRA_CLIENT_SECRET: ${{ secrets.ODIN_JIRA_CLIENT_SECRET }}
          ODIN_JIRA_REDIRECT_URL: ${{ secrets.ODIN_JIRA_REDIRECT_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: Odin-arm64
          path: apps/desktop/release/*.dmg
